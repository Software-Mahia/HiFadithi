# Render Blueprint for HiFadithi. Owner: C.
# Render reads this when you choose New > Blueprint and pick this repository.
# Ported: Docker runtime so the API can run tesseract (OCR) and a django-q2
# worker for the 3D pipeline and Piper TTS jobs.
# Values marked `sync: false` are secrets: Render asks for them once, in its dashboard.
services:
  - type: web
    name: hifadithi-api
    runtime: docker
    plan: free
    region: frankfurt          # close to our Supabase project in Europe
    branch: prod               # deploys only what is merged into prod
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerCommand: web
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      # Generate once with: python -c "import secrets; print(secrets.token_urlsafe(60))"
      - key: SECRET_KEY
        sync: false
      # Supabase session pooler string, ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Supabase Storage (S3 API) — required in Docker: no persistent disk for /app/media
      - key: USE_SUPABASE_STORAGE
        value: "True"
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      # Public base URL for media links handed to the app and the guest gallery
      - key: PUBLIC_BASE_URL
        sync: false
      # Meshy: stays on the fake engine until the first real job (Friday)
      - key: ENGINE
        value: fake
      - key: MESHY_API_KEY
        sync: false
      - key: MESHY_AI_MODEL
        value: meshy-6-lite
      - key: MESHY_WEBHOOK_TOKEN
        generateValue: true
      - key: MESHY_MONTHLY_CREDIT_LIMIT
        value: "300"
      # First admin account. Remove the password from Render after first sign-in.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: worker
    name: hifadithi-worker
    runtime: docker
    plan: free
    region: frankfurt
    branch: prod
    rootDir: backend
    dockerfilePath: Dockerfile
    # worker shares the API entrypoint: migrations + roles, then qcluster
    dockerCommand: worker
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: USE_SUPABASE_STORAGE
        value: "True"
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: ENGINE
        value: fake
      - key: MESHY_API_KEY
        sync: false
      - key: MESHY_AI_MODEL
        value: meshy-6-lite
      - key: MESHY_WEBHOOK_TOKEN
        generateValue: true
      - key: MESHY_MONTHLY_CREDIT_LIMIT
        value: "300"
